name: TeX engine

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/tex-engine/**"
      - ".github/workflows/tex-engine.yml"
    tags: ["tex-engine-v*"]
  pull_request:
    paths:
      - "crates/**"
      - "packages/tex-engine/**"
  # A tagged release publishes to crates.io and npm in two independent jobs, so
  # one can land while the other fails. Re-pushing the tag is not a fix (the tag
  # is immutable and the run would repeat what already succeeded), so the missing
  # half is re-published from here instead. Both publish steps check the registry
  # first, so an accidental double-run is a no-op rather than an error.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build from (e.g. tex-engine-v0.1.3). Every job checks this out, and it is the version that gets published."
        required: true
        type: string
      publish_crate:
        description: "Publish glyphtex-tex-api to crates.io"
        type: boolean
        default: false
      publish_npm:
        description: "Publish glyphtex-engine to npm"
        type: boolean
        default: false

concurrency:
  group: tex-engine-${{ github.ref }}
  # A newer push must not cancel a release half way (npm published, GitHub release not yet).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  EM_VERSION: 5.0.2
  CARGO_TERM_COLOR: always

jobs:
  api:
    name: API crate + TypeScript types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      # git stores the exec bit, but core.filemode=false (the usual Windows
      # setting) drops it silently, and the job then dies on a bare
      # "Permission denied" far from the cause.
      - name: Shell scripts are executable
        run: |
          if git ls-files -s '*.sh' | awk '$1 != "100755" { print "  " $4; found = 1 } END { exit !found }'; then
            echo "::error::The shell scripts above are not executable. Fix: git update-index --chmod=+x <file>"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/glyphtex-tex-api

      - name: Format
        run: cargo fmt --check
        working-directory: crates/glyphtex-tex-api

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/glyphtex-tex-api

      - name: Test
        run: cargo test
        working-directory: crates/glyphtex-tex-api

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate TypeScript types
        run: |
          cd packages/tex-engine
          pnpm install --ignore-workspace --frozen-lockfile=false
          pnpm generate

      - name: Check generated types are up to date
        run: |
          if ! git diff --exit-code -- packages/tex-engine/src/generated; then
            echo "::error::Generated TypeScript is stale. Run 'pnpm generate' in packages/tex-engine and commit."
            exit 1
          fi

      - name: Typecheck wrapper
        run: cd packages/tex-engine && pnpm check

  engine:
    name: Build WASM engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: wasm32-unknown-emscripten
          components: rust-src

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tectonic-wasm

      - name: Cache Emscripten sysroot additions
        uses: actions/cache@v4
        with:
          path: |
            emsdk-cache/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/libgraphite2.a
            emsdk-cache/upstream/emscripten/cache/sysroot/include/graphite2
          key: graphite2-wasm-1.3.14-${{ env.EM_VERSION }}

      - name: Build
        run: ./scripts/build-wasm.sh
        working-directory: crates/tectonic-wasm

      # Enforced, not just reported: a warning in a summary nobody opens is no
      # check at all. Logic + limits live in the script so this file stays legible.
      - name: Check size budget
        run: ./scripts/check-size-budget.sh
        working-directory: crates/tectonic-wasm

      - uses: actions/upload-artifact@v4
        with:
          name: tectonic-wasm
          path: crates/tectonic-wasm/output/tectonic_wasm.wasm
          if-no-files-found: error

  test:
    name: End-to-end compile tests
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: tectonic-wasm
          path: crates/tectonic-wasm/output

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Extract TeX bundle
        run: |
          mkdir -p /tmp/bundle
          tar xzf crates/tectonic-wasm/output/tectonic-bundle.tar.gz -C /tmp/bundle

      - name: Build package
        run: |
          cd packages/tex-engine
          pnpm install --ignore-workspace --frozen-lockfile=false
          pnpm build

      - name: Verify bundle satisfies the manifest
        run: cd packages/tex-engine && pnpm bundle:verify /tmp/bundle

      - name: Test
        env:
          GLYPHTEX_WASM: ${{ github.workspace }}/crates/tectonic-wasm/output/tectonic_wasm.wasm
          GLYPHTEX_BUNDLE: /tmp/bundle
          # Without this the suite skips when an artifact path is wrong and
          # `node --test` still exits 0 — a green job that ran zero tests.
          GLYPHTEX_REQUIRE_ENGINE: "1"
        run: cd packages/tex-engine && pnpm test

  crate:
    name: Publish crate to crates.io
    needs: [api, engine, test]
    if: >-
      startsWith(github.ref, 'refs/tags/tex-engine-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_crate) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          # The next step diffs against the pre-merge commit.
          fetch-depth: 0

      # The npm package ships the packs, so most releases touch only that. A crate with
      # unchanged sources is not republished under a new number just to match.
      - name: Did the crate change in this push?
        id: changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null             || ! git diff --quiet "$BEFORE" HEAD -- crates/glyphtex-tex-api; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::crates/glyphtex-tex-api is unchanged in this push; not publishing the crate."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/glyphtex-tex-api

      # A tag or a manual run names its version. A merge to main uses the version
      # committed in packages/tex-engine/package.json, so bumping it is what asks
      # for a release; an unchanged version finds itself on the registry and skips.
      - name: Derive version
        id: version
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [ -z "$TAG" ]; then
            echo "value=$(jq -r .version packages/tex-engine/package.json)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TAG" in
            tex-engine-v*) ;;
            *) echo "::error::Expected a tex-engine-v* tag, got '$TAG'."; exit 1 ;;
          esac
          echo "value=${TAG#tex-engine-v}" >> "$GITHUB_OUTPUT"

      # Anchored to the line start so it only rewrites the [package] version;
      # dependency versions are inline inside braces and never begin a line.
      # No `$` anchor: Cargo.toml is stored with CRLF, so `"$` matches nothing
      # and the substitution silently does nothing, publishing whatever version
      # happens to be committed. Matching the quoted value explicitly is
      # end-of-line agnostic, and the assertion below catches any future no-op.
      - name: Set crate version from tag
        working-directory: crates/glyphtex-tex-api
        run: |
          v='${{ steps.version.outputs.value }}'
          sed -i -E '0,/^version *= *"[^"]*"/ s//version = "'"$v"'"/' Cargo.toml
          got=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$got" != "$v" ]; then
            echo "::error::Cargo.toml version is $got, expected $v — the version bump did not apply."
            exit 1
          fi
          echo "glyphtex-tex-api $got"

      # Versions on crates.io are immutable, so re-running a release job would
      # otherwise fail on the publish step alone. Checking first makes the job
      # idempotent without letting a genuine failure pass as success.
      - name: Is this version already published?
        id: published
        run: |
          v='${{ steps.version.outputs.value }}'
          if [ '${{ steps.changed.outputs.changed }}' = 'false' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # crates.io answers 403 to requests without a User-Agent, which read as "not published".
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'glyphtex-release (github.com/kanakkholwal/glyphtex)' \
            "https://crates.io/api/v1/crates/glyphtex-tex-api/$v")
          if [ "$code" = 200 ]; then
            echo "::notice::glyphtex-tex-api $v is already on crates.io; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # --allow-dirty: the version bump above is intentionally uncommitted, so
      # the tag stays the single source of truth for what gets released.
      - name: Package (dry run)
        if: steps.published.outputs.skip == 'false'
        working-directory: crates/glyphtex-tex-api
        run: cargo publish --dry-run --allow-dirty

      # --no-verify: the dry run above already did the verification build from
      # the packaged tarball, and repeating it doubles the job for nothing.
      - name: Publish
        if: steps.published.outputs.skip == 'false'
        working-directory: crates/glyphtex-tex-api
        run: cargo publish --allow-dirty --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Release + publish
    needs: [api, engine, test]
    if: >-
      startsWith(github.ref, 'refs/tags/tex-engine-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_npm) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Mints the short-lived npm token via OIDC (trusted publishing), and is
      # what signs provenance. No NPM_TOKEN secret, so 2FA never enters the loop.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: tectonic-wasm
          path: crates/tectonic-wasm/output

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false # never use caching in release builds

      # A tag or a manual run names its version. A merge to main uses the version
      # committed in packages/tex-engine/package.json, so bumping it is what asks
      # for a release; an unchanged version finds itself on the registry and skips.
      - name: Derive version
        id: version
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [ -z "$TAG" ]; then
            echo "value=$(jq -r .version packages/tex-engine/package.json)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TAG" in
            tex-engine-v*) ;;
            *) echo "::error::Expected a tex-engine-v* tag, got '$TAG'."; exit 1 ;;
          esac
          echo "value=${TAG#tex-engine-v}" >> "$GITHUB_OUTPUT"

      # No `pnpm generate` here: it shells out to `cargo test`, which would pull
      # an unpinned Rust into the release job to regenerate files that are
      # already committed and already drift-checked by the `api` job above.
      # sync:wasm stages the engine, the TeX bundle and the default packs.
      # Copying the wasm alone would publish a package whose `./bundle` export
      # points at nothing, and an engine with no format or classes cannot
      # typeset — it instantiates cleanly and fails on the first \documentclass.
      # prepublishOnly re-runs this and refuses to publish if anything is absent.
      - name: Build and stage package
        run: |
          cd packages/tex-engine
          pnpm install --ignore-workspace --frozen-lockfile=false
          pnpm build
          pnpm sync:wasm
          # --allow-same-version: the committed version may already match the tag.
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      # Versions on npm are immutable, so a manual re-run after a partial release
      # would otherwise fail on the publish step alone.
      - name: Is this version already published?
        id: published
        run: |
          v='${{ steps.version.outputs.value }}'
          if npm view "glyphtex-engine@$v" version >/dev/null 2>&1; then
            echo "::notice::glyphtex-engine $v is already on npm; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm >= 11.5.1; the Node 24 image can ship older.
      # Pinned to the 11.x major: `@latest` silently pulled npm 12, whose
      # `pack --json` output shape broke the preflight script mid-release.
      - name: Ensure npm supports trusted publishing
        if: steps.published.outputs.skip == 'false'
        run: npm install -g "npm@^11.5.1"

      # No --provenance and no NODE_AUTH_TOKEN: with trusted publishing npm
      # exchanges the job's OIDC token for a short-lived credential and attaches
      # provenance itself. Requires glyphtex-engine to name this repo + workflow
      # as a trusted publisher on npmjs.com.
      - name: Publish to npm
        if: steps.published.outputs.skip == 'false'
        run: cd packages/tex-engine && npm publish

      # A tag push has its release. A merge to main that just published creates the tag
      # and release itself, so the version in package.json is always tagged. A manual
      # npm-only re-publish must not try to create one from a branch ref.
      - name: Compress engine for release
        if: >-
          startsWith(github.ref, 'refs/tags/tex-engine-v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.skip == 'false')
        run: brotli -q 11 -k crates/tectonic-wasm/output/tectonic_wasm.wasm

      # Creating the tag through the release API does not start another workflow run,
      # so this cannot loop back into the tag-triggered release.
      - uses: softprops/action-gh-release@v2
        if: >-
          startsWith(github.ref, 'refs/tags/tex-engine-v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.skip == 'false')
        with:
          tag_name: tex-engine-v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: |
            crates/tectonic-wasm/output/tectonic_wasm.wasm
            crates/tectonic-wasm/output/tectonic_wasm.wasm.br
            crates/tectonic-wasm/output/tectonic-bundle.tar.gz
          generate_release_notes: true
