name: cli

# Tests the `glyphtex` command-line package on every OS it supports, and publishes it to npm
# when main carries a version that is not on the registry yet. Publishing uses npm trusted
# publishing: the package must name this repo and workflow as a trusted publisher on npmjs.com.

on:
  push:
    branches: [main]
    paths: ["packages/cli/**", "packages/tex-engine/**", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["packages/cli/**", "packages/tex-engine/**", ".github/workflows/cli.yml"]
  workflow_dispatch:

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter glyphtex-engine build
      - run: pnpm --filter glyphtex check
      - run: pnpm --filter glyphtex test

  # The native engine downloads Tectonic and fetches TeX packages, so it is checked on every OS
  # separately: this is the only place the Linux and macOS download and unpack paths run.
  native:
    name: native engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter glyphtex-engine build
      - run: pnpm --filter glyphtex build
      - run: node packages/cli/bin/glyphtex.mjs engine install
      - run: node packages/cli/bin/glyphtex.mjs doctor
      - name: Build with the native engine
        run: node packages/cli/bin/glyphtex.mjs build packages/cli/test/fixtures/resume --engine native --json

  publish:
    needs: [test, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its tag
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter glyphtex-engine build
      - run: pnpm --filter glyphtex build

      - name: Is this version already published?
        id: published
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Trusted publishing can only be configured for a package that exists, so the very first
          # version is published once from a maintainer machine (see packages/cli/README.md).
          if ! npm view glyphtex name >/dev/null 2>&1; then
            echo "::notice::glyphtex is not on npm yet. Publish 0.1.0 locally once, then add this workflow as a trusted publisher."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif npm view "glyphtex@$v" version >/dev/null 2>&1; then
            echo "::notice::glyphtex $v is already on npm; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm >= 11.5.1; pinned to 11.x like the engine package.
      - name: Ensure npm supports trusted publishing
        if: steps.published.outputs.skip == 'false'
        run: npm install -g "npm@^11.5.1"

      # pnpm pack rewrites the workspace dependency on glyphtex-engine to a real version range;
      # npm then publishes the tarball with no token, exchanging the job's OIDC identity.
      - name: Publish to npm
        if: steps.published.outputs.skip == 'false'
        run: |
          cd packages/cli
          pnpm pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP/glyphtex-${{ steps.published.outputs.version }}.tgz" --access public

      # The tag is created here, from the commit that was published, so package.json and the tag
      # never disagree. Creating it through the release API does not start another run.
      - uses: softprops/action-gh-release@v2
        if: steps.published.outputs.skip == 'false'
        with:
          tag_name: cli-v${{ steps.published.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: glyphtex ${{ steps.published.outputs.version }}
          generate_release_notes: true

      # A change that was not released stays visible: bump packages/cli/package.json to ship it.
      - name: Remind to bump the version
        if: steps.published.outputs.skip == 'true'
        run: |
          last="cli-v${{ steps.published.outputs.version }}"
          git fetch --tags --quiet
          git rev-parse -q --verify "refs/tags/$last" >/dev/null || exit 0
          if ! git diff --quiet "$last" HEAD -- packages/cli/src packages/cli/bin packages/cli/package.json; then
            echo "::warning::The CLI changed since $last but its version was not bumped, so nothing was published."
          fi
