name: glyphtex

x-server-env: &server-env
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
  APP_URL: ${APP_URL:-http://localhost:5173}
  WEB_ORIGINS: ${WEB_ORIGINS:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 48)}
  DATABASE_URL: postgres://glyphtex:${POSTGRES_PASSWORD:-glyphtex}@postgres:5432/glyphtex
  REDIS_URL: redis://redis:6379
  QUEUE_DRIVER: ${QUEUE_DRIVER:-redis}
  RABBITMQ_URL: amqp://glyphtex:${RABBITMQ_PASSWORD:-glyphtex}@rabbitmq:5672
  BLOB_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-glyphtex}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-glyphtex}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-glyphtex-secret}
  MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
  MAIL_FROM: ${MAIL_FROM:-GlyphTeX <no-reply@localhost>}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
  GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
  GITLAB_ISSUER: ${GITLAB_ISSUER:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glyphtex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glyphtex}
      POSTGRES_DB: glyphtex
    volumes: [postgres:/var/lib/postgresql/data]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glyphtex"]
      interval: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  # Any S3-compatible store works; RustFS is the default because MinIO stopped publishing images.
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-glyphtex}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-glyphtex-secret}
    volumes: [s3:/data]
    ports: ["${S3_PORT:-9000}:9000"]

  s3-init:
    image: curlimages/curl:latest
    depends_on: [s3]
    entrypoint: >
      sh -c "until curl -sf -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3
      --user $${S3_ACCESS_KEY_ID}:$${S3_SECRET_ACCESS_KEY} -X PUT http://s3:9000/$${S3_BUCKET}
      || curl -sf -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3
      --user $${S3_ACCESS_KEY_ID}:$${S3_SECRET_ACCESS_KEY} -I http://s3:9000/$${S3_BUCKET};
      do sleep 1; done"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-glyphtex}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-glyphtex-secret}
      S3_BUCKET: ${S3_BUCKET:-glyphtex}

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: [rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: glyphtex
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-glyphtex}
    ports: ["${RABBITMQ_PORT:-5672}:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["${MAILPIT_PORT:-8025}:8025", "1025:1025"]

  migrate:
    build: { context: ../.., dockerfile: apps/server/Dockerfile }
    command: ["node", "src/db/migrate.ts"]
    environment: *server-env
    depends_on:
      postgres: { condition: service_healthy }

  server:
    build: { context: ../.., dockerfile: apps/server/Dockerfile }
    environment: *server-env
    ports: ["${PORT:-8787}:8787"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/readyz"]
      interval: 10s
      retries: 5

  jobs:
    build: { context: ../.., dockerfile: apps/server/Dockerfile }
    command: ["node", "src/entry/node-jobs.ts"]
    environment: *server-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  postgres:
  redis:
  s3:
